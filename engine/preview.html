<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/fonts/motion.css">
<style>
:root{--ink:#0B1220;--sub:#5B6B85;--blue:#0A55EA;--blue2:#3A86FF;--sky:#9FD6FF;--red:#FF3B30;--bg:#F5F8FD}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}#grain{display:none}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;font-family:'Inter','Anuphan',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--bg)}
#bg{position:absolute;inset:0}
#view{position:absolute;inset:0;perspective:1600px;perspective-origin:540px 960px}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-style:preserve-3d;transform-origin:540px 960px;display:none}
.n{position:absolute;left:0;top:0;transform-style:flat;will-change:transform,opacity,filter}
.c{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
.tx{white-space:nowrap;line-height:1.18;letter-spacing:-.01em}
.th{font-family:'Anuphan','Inter',sans-serif}
.w100{font-weight:100}.w200{font-weight:200}.w300{font-weight:300}.w400{font-weight:400}.w500{font-weight:500}.w600{font-weight:600}.w700{font-weight:700}
.gb{background:linear-gradient(180deg,#3A86FF 0%,#0A55EA 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.3em .08em .12em;margin:-.3em -.08em -.12em}
.gsky{background:linear-gradient(180deg,#0B1220 0%,#28457A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.3em .08em .12em;margin:-.3em -.08em -.12em}
.red{color:var(--red)}
.glass{position:absolute;background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.86) 100%);border-radius:36px;box-shadow:0 26px 64px rgba(16,42,94,.15),0 2px 8px rgba(16,42,94,.06),inset 0 0 0 1.5px rgba(255,255,255,.95),inset 0 1px 0 rgba(255,255,255,1)}
.pill{position:absolute;display:flex;align-items:center;gap:14px;padding:14px 30px;border-radius:999px;background:rgba(255,255,255,.82);box-shadow:0 14px 34px rgba(16,42,94,.14),inset 0 0 0 1.5px rgba(255,255,255,.98);font-family:'Anuphan','Inter';font-weight:600;font-size:38px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.pill.blue{background:linear-gradient(180deg,#3A86FF,#0A55EA);color:#fff;box-shadow:0 16px 36px rgba(10,85,234,.32),inset 0 1px 0 rgba(255,255,255,.35)}
.pill .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 6px rgba(10,85,234,.14)}
.prod{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
.prod img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 26px 30px rgba(16,42,94,.16))}
.win{position:absolute;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(16,42,94,.20),0 4px 12px rgba(16,42,94,.08),inset 0 0 0 1px rgba(16,42,94,.06)}
.win .bar{height:56px;background:linear-gradient(180deg,#F8FAFD,#EEF2F8);display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid rgba(16,42,94,.07)}
.win .bar i{width:16px;height:16px;border-radius:50%;display:block}
.win .bar b{margin-left:14px;font:600 24px 'Inter','Anuphan';color:#5B6B85;letter-spacing:-.01em}
.win img{display:block;width:100%}
.phone{position:absolute;border-radius:76px;background:#0E1424;padding:16px;box-shadow:0 50px 110px rgba(16,42,94,.28),inset 0 0 0 2px #2A3550}
.phone .scr{border-radius:62px;overflow:hidden;width:100%;height:100%;background:#fff;position:relative}
.phone .scr img{width:100%;height:100%;object-fit:cover;display:block}
.phone .isl{position:absolute;top:30px;left:50%;width:150px;height:44px;margin-left:-75px;border-radius:24px;background:#0E1424;z-index:3}
.clipcard{position:absolute;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 22px 50px rgba(16,42,94,.18),inset 0 0 0 1.5px rgba(255,255,255,.9)}
.clipcard img{display:block;width:100%;height:100%;object-fit:cover}
.cart{position:absolute;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:#FF7A1A;color:#fff;font:700 24px 'Inter','Anuphan';box-shadow:0 8px 20px rgba(255,122,26,.35)}
.bub{position:absolute;padding:24px 34px;border-radius:34px;background:rgba(255,255,255,.94);box-shadow:0 18px 44px rgba(16,42,94,.15),inset 0 0 0 1.5px #fff;font:600 44px 'Anuphan','Inter';color:var(--ink);white-space:nowrap}
.bub.me{background:linear-gradient(180deg,#3A86FF,#0A55EA);color:#fff}
.av{width:58px;height:58px;border-radius:50%;flex:none}
.sheen{position:absolute;inset:-20%;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 60%);mix-blend-mode:screen}
#grain{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;opacity:.035;mix-blend-mode:multiply}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,rgba(255,255,255,1) 0%,rgba(234,243,255,.9) 45%,rgba(234,243,255,0) 75%);opacity:0}
</style></head>
<body><div id="stage"><canvas id="bg" width="1080" height="1920"></canvas><div id="view"></div><canvas id="grain" width="2" height="2"></canvas><div id="flash"></div></div>
<script>
// ---------------- core maths ----------------
const W=1080,H=1920,CX=540,CY=960;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,u)=>a+(b-a)*u;
function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t, sy=t=>((ay*t+by)*t+cy)*t, dx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{x=clamp(x);let t=x;for(let i=0;i<8;i++){const d=dx(t);if(Math.abs(d)<1e-6)break;t-=(sx(t)-x)/d;t=clamp(t);}return sy(t);};}
const E={in:bez(.16,1,.3,1),out:bez(.7,0,.84,0),move:bez(.65,0,.35,1),lin:x=>clamp(x),io:bez(.45,0,.55,1),expo:x=>x>=1?1:1-Math.pow(2,-10*clamp(x))};
const F=1/30;                                   // design frame (timings are written in 30 fps frames)
const k=(t,a,d,e=E.in)=>e(clamp((t-a)/d));      // progress 0..1 starting at a, lasting d seconds
const kf=(t,a,n,e=E.in)=>k(t,a,n*F,e);          // same with n frames
function spring(t,a,w=13){if(t<=a)return 0;const x=(t-a)*w;return 1-(1+x)*Math.exp(-x);}   // critically damped, settles ~0.5 s
const decay=(t,a,r=0.88)=>t<=a?0:1-Math.pow(r,(t-a)*30);   // "remaining distance x r per frame"
const SEED=n=>{let s=n*9301+49297;return()=>((s=(s*9301+49297)%233280)/233280);};
// ---------------- DOM helpers ----------------
const FIT=[];
const autoMax=css=>/translate\(0,/.test(css)?924:/translate\(-100%/.test(css)?924:960;
function fitAll(){const roots=[...document.querySelectorAll('.scene')];roots.forEach(r=>r.style.display='block');for(const d of FIT){const c=d.firstElementChild;const w=c.scrollWidth,m=+d.dataset.fit;if(!m||w<=m)continue;const f=m/w;const tr=c.style.transform||'translate(-50%,-50%)';
  c.style.transformOrigin=/translate\(0,/.test(tr)?'0 50%':/translate\(-100%/.test(tr)?'100% 50%':'50% 50%';
  c.style.transform=tr+` scale(${f.toFixed(4)})`;}roots.forEach(r=>r.style.display='none');}
const view=document.getElementById('view'),VIEWF=view;
function scene(a,b){const d=document.createElement('div');d.className='scene';view.appendChild(d);return {root:d,a,b};}
function nd(parent,html='',cls='',css=''){const d=document.createElement('div');d.className='n'+(cls?' '+cls:'');if(css)d.style.cssText+=css;d.innerHTML=html;(parent.root||parent).appendChild(d);d._p={};return d;}
// place node: world coords (x,y,z) of its centre, plus rotations/scale/opacity/blur
function P(d,o){const x=o.x??0,y=(o.y??0)+(o.dy??0),z=o.z??0,rx=o.rx??0,ry=o.ry??0,rz=o.rz??0,s=o.s??1,sx=o.sx??1,sy=o.sy??1;
  d.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s*sx},${s*sy})`;
  const op=o.o??1; d.style.opacity=op<0.002?0:op; d.style.visibility=op<0.002?'hidden':'visible';
  const b=o.blur??0; d.style.filter=b>0.25?`blur(${b.toFixed(2)}px)`:(o.f||'none');}
// text node (centre anchored); parts: [[text, cls], ...] on one line
function T(parent,parts,size,css='',maxw=0){const html=parts.map(p=>`<span class="tx th ${p[1]||''}" style="font-size:${p[2]||size}px">${p[0]}</span>`).join('');const d=nd(parent,`<div class="c" style="${css}">${html}</div>`);d.dataset.fit=maxw||autoMax(css);FIT.push(d);return d;}
// word-by-word text: returns node with .w spans for per-word animation
function TW(parent,words,size,cls='w700',css='',gap=0.22){const html=words.map(w=>{const [txt,c,sz]=Array.isArray(w)?w:[w];return `<span class="ww" style="display:inline-block;margin:0 ${gap/2}em"><span class="tx th ${c||cls}" style="display:inline-block;font-size:${sz||size}px">${txt}</span></span>`}).join('');
  const d=nd(parent,`<div class="c" style="white-space:nowrap;${css}">${html}</div>`);d.ws=[...d.querySelectorAll('.ww')];d.dataset.fit=autoMax(css);FIT.push(d);return d;}
function setW(span,o){const y=(o.y??0)+(o.dy??0),s=o.s??1,rz=o.rz??0,x=o.x??0;span.style.transform=`translate(${x}px,${y}px) rotate(${rz}deg) scale(${s})`;const op=o.o??1;span.style.opacity=op;const b=o.blur??0;span.style.filter=b>0.25?`blur(${b.toFixed(2)}px)`:'none';}
function IMG(parent,src,w,h,cls='prod',css=''){return nd(parent,`<div class="${cls}" style="width:${w}px;height:${h}px;${css}"><img src="${src}"></div>`);}
const PROD=n=>`assets/products/${n}.png`;
const MED=(m,t,loop=true)=>{const M=MEDIA[m];let f=Math.floor((t-(window.__t-(window.TQ??window.__t)))*30);f=loop?((f%M.n)+M.n)%M.n:Math.min(M.n-1,Math.max(0,f));return `assets/media/${m}/f${String(f+1).padStart(4,'0')}.jpg`;};
function vid(node,m,t){const im=node.querySelector('img');const s=MED(m,t);if(im._s!==s){im.src=s;im._s=s;}}
// blur-rise entrance (T12): returns props for time t
function rise(t,a,n=14,dy=46,b0=14){const u=kf(t,a,n);return {o:clamp((t-a)/(n*F*0.55)),dy:dy*(1-u),blur:b0*(1-kf(t,a,Math.max(3,n*0.45)))};}
function leave(t,a,n=7,dy=-30,b1=12){const u=kf(t,a,n,E.out);return {o:1-u,dy:dy*u,blur:b1*u};}

// ---------------- kinetic-type toolkit (v2) ----------------
// keyframes in 30-fps frames relative to t0: KF(t,t0,[[f,v],...],ease)  (linear between keys unless ease given per segment)
function KF(t,t0,keys){const f=(t-t0)*30;if(f<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(f<=keys[i][0]){const [f0,v0]=keys[i-1],[f1,v1,e]=keys[i];const u=(f-f0)/(f1-f0);return lerp(v0,v1,(e||E.lin)(u));}}return keys[keys.length-1][1];}
const GSEG=new Intl.Segmenter('th',{granularity:'grapheme'});
const graphemes=s=>[...GSEG.segment(s)].map(x=>x.segment);
// text block: lines=[{txt, cls, w (target width px) | size, dx (indent px)}], anchor 'l' (left-middle) or 'c'
const BLOCKS=[];
function TB(parent,lines,anchor='l',css=''){
  const html=lines.map((L,i)=>`<div class="ln" data-w="${L.w||0}" style="white-space:nowrap;margin-left:${L.dx||0}px;line-height:${L.lh||1.08};${L.css||''}">${(L.type?graphemes(L.txt).map(g=>`<span class="g${/gb/.test(L.cls||'')?' gb':''}" style="display:inline-block">${g===' '?'&nbsp;':g}</span>`).join(''):`<span class="lt" style="display:inline-block">${L.txt}</span>`)}</div>`).join('');
  const d=nd(parent,`<div class="blk" style="position:absolute;left:0;top:0;transform:${anchor==='c'?'translate(-50%,-50%)':'translate(0,-50%)'};text-align:${anchor==='c'?'center':'left'};${css}">${html}</div>`);
  d.lines=[...d.querySelectorAll('.ln')];d.lines.forEach((ln,i)=>{if(!/font-family/.test(lines[i].css||''))ln.style.fontFamily="'Anuphan','Inter',sans-serif";ln.className='ln tx '+((lines[i].type?(lines[i].cls||'w700').replace(/\bgb\b/,''):(lines[i].cls||'w700')));ln.style.fontSize=(lines[i].size||120)+'px';ln.g=[...ln.querySelectorAll('.g')];});
  BLOCKS.push(d);return d;}
function fitBlocks(){const roots=[...document.querySelectorAll('.scene')];roots.forEach(r=>r.style.display='block');
  const RG=document.createRange();for(const d of BLOCKS)for(const ln of d.lines){const w=+ln.dataset.w;if(!w)continue;RG.selectNodeContents(ln);const cur=RG.getBoundingClientRect().width;if(cur>0){ln.style.fontSize=(parseFloat(ln.style.fontSize)*w/cur).toFixed(1)+'px';}}
  roots.forEach(r=>r.style.display='none');}
// type-on: graphemes appear one by one (rate g/frame) with a fade-up (start 18px low, 35% → 100% over 4 frames)
function typeOn(ln,t,t0,rate=1){const n=ln.g.length;ln.g.forEach((g,i)=>{const a=t0+i/(rate*30);const u=clamp((t-a)/(4/30));g.style.opacity=t<a?0:(0.35+0.65*E.in(u));g.style.transform=`translateY(${18*(1-E.in(u))}px)`;});}
// soft "light-on" flicker (Apple version of the neon flicker)
const FLK=[0.7,0.5,0.05,0.95,0.55,0.05,0.5,0.88,0.5,0.1,0.6,1];
function flicker(t,t0){const f=Math.floor((t-t0)*30+0.02);return f<0?0:f>=FLK.length?1:FLK[f];}
// perspective grid plane (world element)
function gridPlane(parent,w=3200,h=3200,cell=110,col='rgba(10,85,234,.10)'){return nd(parent,`<div class="c" style="width:${w}px;height:${h}px;background-image:linear-gradient(${col} 2px,transparent 2px),linear-gradient(90deg,${col} 2px,transparent 2px);background-size:${cell}px ${cell}px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 70%)"></div>`);}
// glass spinner tile
function spinTile(parent,s=130){return nd(parent,`<div class="glass c" style="width:${s}px;height:${s}px;border-radius:${s*0.26}px"><div class="sp" style="position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:50%;background:conic-gradient(from 0deg,#3A86FF,#9FD6FF,rgba(58,134,255,0) 75%);-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%)"></div></div>`);}
function spin(node,t,rps=1){const s=node.querySelector('.sp');if(s)s.style.transform=`rotate(${(t*360*rps)%360}deg)`;}

// ---------------- background ----------------
const bg=document.getElementById('bg').getContext('2d');
function drawBG(t,tone){// tone: {a:'#F5F8FD', b:'#E7F0FC', glow:[x,y,r,color,alpha]...}
  const g=bg.createLinearGradient(0,0,0,H);g.addColorStop(0,tone.a);g.addColorStop(1,tone.b);bg.fillStyle=g;bg.fillRect(0,0,W,H);
  for(const [x,y,r,c,al] of tone.glows||[]){const rg=bg.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(${c},${al})`);rg.addColorStop(1,`rgba(${c},0)`);bg.fillStyle=rg;bg.fillRect(0,0,W,H);}
  if(tone.dots){bg.fillStyle=`rgba(11,18,32,${tone.dots})`;const off=(tone.dotOff||0)%48;for(let y=-48+off;y<H+48;y+=48)for(let x=24;x<W;x+=48){bg.beginPath();bg.arc(x,y,1.6,0,6.283);bg.fill();}}
}
const gr=document.getElementById('grain').getContext('2d');
function grain(t){const r=SEED(Math.floor(t*60)+7);const id=gr.createImageData(540,960);for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}gr.putImageData(id,0,0);}
const flash=document.getElementById('flash');
// ---------------- timeline ----------------
const SCENES=[];
function add(sc,update,tone){sc.update=update;sc.tone=tone;SCENES.push(sc);return sc;}
let MEDIA=null;
window.__seek=async t=>{
  window.__t=t;window.TQ=Math.floor(t*60+1e-6)/60;
  let tone=null;window.__flash2=0;VIEWF.style.filter='none';
  for(const sc of SCENES){const on=t>=sc.a&&t<sc.b;sc.root.style.display=on?'block':'none';if(on){sc.update(t);tone=typeof sc.tone==='function'?sc.tone(t):sc.tone;}}
  drawBG(t,tone||{a:'#F5F8FD',b:'#E8F0FB'});grain(t);
  flash.style.opacity=Math.max(window.__flash?window.__flash(t):0,window.__flash2||0);
  // wait for images used this frame
  const vis=[...document.querySelectorAll('.scene img')].filter(i=>i.closest('.scene').style.display==='block');
  await Promise.all(vis.map(i=>i.complete?(i.decode?i.decode().catch(()=>{}):1):new Promise(r=>{i.onload=i.onerror=r;})));
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  return true;
};
</script>
<script>let MEDIA0={};window.FOOT={};</script>
<script src="kit.js"></script>
<script src="preview-scenes.js"></script>
<script>
// live preview: synchronous seek (no image waits, no film grain) + autoplay loop
window.__seekSync=t=>{window.__t=t;window.TQ=Math.floor(t*60+1e-6)/60;let tone=null;window.__flash2=0;VIEWF.style.filter='none';
  for(const sc of SCENES){const on=t>=sc.a&&t<sc.b;sc.root.style.display=on?'block':'none';if(on){sc.update(t);tone=typeof sc.tone==='function'?sc.tone(t):sc.tone;}}
  drawBG(t,tone||{a:'#F5F8FD',b:'#E8F0FB'});flash.style.opacity=Math.max(window.__flash?window.__flash(t):0,window.__flash2||0);};
document.fonts.ready.then(()=>{fitAll();fitBlocks();const t0=performance.now();const loop=n=>{__seekSync(((n-t0)/1000)%DUR);requestAnimationFrame(loop);};requestAnimationFrame(loop);});
</script>
</body></html>
